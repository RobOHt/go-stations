# GO Stations API proxy. Deployed by .github/workflows/worker.yml.
name = "go-stations"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Cloudflare caches responses per their Cache-Control header (set in src/index.js),
# and collapses identical concurrent requests into one.
[cache]
enabled = true

# Per-IP limit on requests that miss the cache (and so reach Metrolinx).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

[observability]
enabled = true

# The tracked trains' Live Activity push schedules (see LiveActivities in src/index.js).
[[durable_objects.bindings]]
name = "LIVE_ACTIVITIES"
class_name = "LiveActivities"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveActivities"]

# The watcher: GO's live feeds every 5 seconds, all day (see src/watcher.js).
[[durable_objects.bindings]]
name = "WATCHER"
class_name = "Watcher"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Watcher"]

# Every minute: the watcher is still running (an alarm that keeps failing stops being retried).
[triggers]
crons = ["* * * * *"]

# Every change in the live feeds the watcher sees, an hour to a file (positions/YYYY/MM/DD/HH.ndjson.gz, UTC).
# The deploy workflow creates the bucket if it isn't there.
[[r2_buckets]]
binding = "POSITIONS"
bucket_name = "go-stations-positions"

# How far each way of drawing a train is from the real one, a data point per train,
# minute, phase and model (see `point` in src/watch.js). Grafana reads it: docs/WATCHER.md.
[[analytics_engine_datasets]]
binding = "SCORES"
dataset = "go_stations_scores"

[vars]
# "off" stops the watcher (it stops at its next look); the app doesn't need it.
WATCH = "on"
