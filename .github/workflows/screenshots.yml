name: Screenshots

# Runs a Debug build in the iOS Simulator, opens it in a few set-up states
# (Departures/App/DebugScene.swift), screenshots each, and force-pushes the
# PNGs to a screenshots-<branch> branch, so changes can be checked by eye before
# they go to TestFlight. Runs on pushes to preview/** branches, or by hand: by
# hand, optionally on an older iOS (its simulator is downloaded when the image
# lacks it) or another iPhone, published to screenshots-<branch>-ios<N>-<device>.
on:
  push:
    branches: ["preview/**"]
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS version (say 18); empty for the newest"
        default: ""
      device:
        description: "iPhone model (say iPhone 16 Pro); empty for the usual one"
        default: ""

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}-${{ inputs.ios }}-${{ inputs.device }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build
    # GitHub's Xcode 27 image (macOS 27, Apple silicon) with the iOS 27 SDK and simulators.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          # Build with the iOS 27 SDK so the app gets iOS 27's own look (scroll edge
          # effects changed in iOS 27). 27.1 is the newest release App Store Connect
          # takes; fall back to the newest other 27.x release.
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Bundle a fresh timetable
        run: |
          # Same as TestFlight builds: the committed copy may not cover today.
          python3 tools/build_schedule.py --output Departures/Resources/schedule.json \
            || echo "::warning title=Timetable::Couldn't build a fresh timetable; using the committed copy"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Departures.xcodeproj \
            -scheme Departures \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || {
              errors=$(grep -E "error:" build.log | sed "s#${GITHUB_WORKSPACE}/##" | sort -u | head -40)
              body=$(printf '%s' "$errors" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=Build failed::$body"
              exit 1
            }
          tail -3 build.log

      - name: Keep the app for the screenshots
        run: |
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/Departures.app Departures.app.zip
          # The SF Symbols the app names, as this (newest) macOS knows them, to check on the simulator's iOS.
          python3 .github/scripts/check_symbols.py list Departures DeparturesWidgets > symbols.tsv
          wc -l < symbols.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          # With the timetable it bundled, which the start-up check compares against.
          path: |
            Departures.app.zip
            symbols.tsv
            Departures/Resources/schedule.json
          retention-days: 3

  shots:
    name: Simulator screenshots
    needs: build
    # The Xcode 27 image's iOS 27 simulators; for an iOS before 26, GitHub's macOS 15
    # image, which still has iOS 18's (Xcode 27 can't download those). Either runs the
    # app built above.
    runs-on: ${{ inputs.ios != '' && fromJSON(inputs.ios) < 26 && 'macos-15' || 'xcode-27' }}
    timeout-minutes: 50
    env:
      BUNDLE_ID: com.robinzhong.Departures
      IOS_VERSION: ${{ inputs.ios }}
      DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: simulator-app

      - name: Unpack the app
        run: |
          mkdir -p build/Build/Products/Debug-iphonesimulator
          ditto -x -k Departures.app.zip build/Build/Products/Debug-iphonesimulator
          # The newest Xcode 27 when the image has one, as for the build; otherwise its own.
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Boot a simulator
        id: sim
        run: |
          # Show the on-screen keyboard rather than assuming a hardware one.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          if ! python3 .github/scripts/pick_simulator.py > sim.txt; then
            # An older iOS than the image has: download its simulator (newest point release first).
            for v in "$IOS_VERSION" "$IOS_VERSION.6" "$IOS_VERSION.5" "$IOS_VERSION.4" "$IOS_VERSION.3" \
                     "$IOS_VERSION.2" "$IOS_VERSION.1" "$IOS_VERSION.0"; do
              echo "Downloading the iOS $v simulator"
              if xcodebuild -downloadPlatform iOS -buildVersion "$v"; then break; fi
            done
            python3 .github/scripts/pick_simulator.py > sim.txt
          fi
          read -r RUNTIME TYPE NAME < sim.txt
          echo "Simulator: $NAME on $RUNTIME"
          UDID=$(xcrun simctl create shots "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          ROOT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; print(next(r['runtimeRoot'] for r in json.load(sys.stdin)['runtimes'] if r['identifier'] == sys.argv[1]))" "$RUNTIME")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Check the app's SF Symbols exist on this iOS
        continue-on-error: true
        env:
          ROOT: ${{ steps.sim.outputs.root }}
        run: python3 .github/scripts/check_symbols.py check "$ROOT" symbols.tsv

      - name: Install the app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Departures.app
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID" || true
          xcrun simctl location "$UDID" set 43.6453,-79.3806
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged \
            --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Take screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p shots
          shoot() {
            name=$1; wait=$2; scene=$3; shift 3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -debugScene "$scene" \
              -homeStation OA -workStation UN "$@" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot --type=png "shots/$name.png" > /dev/null 2>&1
            echo "$name"
          }
          # The first launch also warms up map tiles.
          shoot 1-map 20 map
          shoot 1b-tracked-trip 25 trackedTrip
          # Settings > Show all trains: every train running now, from the timetable.
          shoot 1c-all-trains 20 allTrains -showsAllTrains YES
          # The map at five widths around Union, then elsewhere on the network (dark,
          # then a few in light), for how readable the stations are.
          for width in 2000 6000 15000 40000 100000; do
            shoot "m-union-${width}" 9 map -mapCenter 43.6453,-79.3806 -mapWidth "$width"
          done
          shoot m-oakville-6000 9 map -mapCenter 43.4553,-79.6828 -mapWidth 6000
          shoot m-oakville-20000 9 map -mapCenter 43.4553,-79.6828 -mapWidth 20000
          shoot m-brampton-12000 9 map -mapCenter 43.6900,-79.7500 -mapWidth 12000
          shoot m-hamilton-25000 9 map -mapCenter 43.2900,-79.8300 -mapWidth 25000
          shoot m-markham-15000 9 map -mapCenter 43.8700,-79.2900 -mapWidth 15000
          shoot m-whitby-15000 9 map -mapCenter 43.8700,-78.9300 -mapWidth 15000
          shoot m-barrie-15000 9 map -mapCenter 44.3600,-79.6900 -mapWidth 15000
          # The station tags as the map changes, recorded (DebugScene.mapTour): the
          # names popping up, a zoom in, a station opened and closed, a pan.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
          sleep 1
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shots/tour.mp4 > /dev/null 2>&1 &
          RECORDER=$!
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -debugScene mapTour \
            -homeStation OA -workStation UN > /dev/null
          sleep 19
          kill -INT "$RECORDER" 2> /dev/null || true
          wait "$RECORDER" || true
          ls -l shots/tour.mp4 || true
          xcrun simctl ui "$UDID" appearance light
          shoot m-light-union-6000 9 map -mapCenter 43.6453,-79.3806 -mapWidth 6000
          shoot m-light-union-40000 9 map -mapCenter 43.6453,-79.3806 -mapWidth 40000
          shoot m-light-oakville-20000 9 map -mapCenter 43.4553,-79.6828 -mapWidth 20000
          xcrun simctl ui "$UDID" appearance dark

          # Someone new: no home or work, no board opened yet (the hint bottom left).
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -debugScene map -openedABoard NO > /dev/null
          sleep 12
          xcrun simctl io "$UDID" screenshot --type=png shots/1d-new-user.png > /dev/null 2>&1
          echo 1d-new-user
          shoot 2-search-focused 8 searchFocused
          shoot 2b-search-tap-away 10 searchTapAway
          shoot 3-search-typing 10 searchTyping
          shoot 4-place 15 place
          shoot 5-station 12 station
          # Union is the made-up work station: its board shows trains toward home, or all of them.
          shoot 5b-station-all-directions 12 station -showAllDirections YES
          # A quiet station (one train a weekday): the timetable fills the board, days ahead if need be.
          shoot 5c-quiet-station 15 stationLarge -debugStation SF
          # A day picked on the week strip: Union two days ahead, the whole day toward home.
          shoot 5d-station-planned 12 station -boardDaysAhead 2
          shoot 5e-station-planned-large 12 stationLarge -boardDaysAhead 2
          # Narrowed to a part of the day (a long day has the switch).
          shoot 5f-station-planned-noon 12 stationLarge -boardDaysAhead 2 -boardPeriod noon
          shoot 6-station-large 10 stationLarge
          shoot 7-trip 15 trip
          # Control: a board scrolled under its pinned header (does the simulator draw edge effects?).
          shoot 8-station-scrolled 16 stationScrolled
          # The home and work buttons ask first: replace home (set to Oakville), remove work (Union).
          shoot 9-home-dialog 14 homeDialog
          shoot 10-work-dialog 14 workDialog
          shoot 11-station-earlier 14 stationEarlier

          # The tracked train's Live Activity: track one, then switch to Settings. The
          # simulator's screenshots only caught the island while the app's alert
          # (sent a few seconds after the switch) showed it, so take a quick burst.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -debugScene liveActivity \
            -homeStation OA -workStation UN > /dev/null
          sleep 25
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
          sleep 3
          for i in 1 2 3 4 5 6 7 8; do
            xcrun simctl io "$UDID" screenshot --type=png "shots/12-island-$i.png" > /dev/null 2>&1
            sleep 0.5
          done
          xcrun simctl terminate "$UDID" com.apple.Preferences > /dev/null 2>&1 || true
          echo 12-island
          # Its views drawn in the app: Lock Screen, compact, minimal, expanded.
          shoot 13-activity-gallery 8 activityGallery
          shoot 13b-activity-lock-screen 8 activityGallery -galleryLockScreen YES

      - name: Trace the tracked train's motion
        if: always() && steps.sim.outputs.udid != ''
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # Two and a half minutes of the tracked train on live data, as it's drawn
          # each second (debug builds log it with -traceTrains): how smoothly it moves.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
          container=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          rm -f "$container/Documents/train-trace.tsv"
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -debugScene trackedTrip -traceTrains YES \
            -openTripAfter 150 -homeStation OA -workStation UN > /dev/null < /dev/null
          sleep 145
          xcrun simctl io "$UDID" screenshot --type=png shots/14-traced-trip.png > /dev/null 2>&1 || true
          # Then its stops open, with how fast it's going.
          sleep 12
          xcrun simctl io "$UDID" screenshot --type=png shots/14b-traced-trip-stops.png > /dev/null 2>&1 || true
          if cp "$container/Documents/train-trace.tsv" shots/ 2> /dev/null; then
            python3 tools/trace_summary.py shots/train-trace.tsv | tee trace-summary.txt
            echo "::notice title=Train motion::$(head -4 trace-summary.txt | tr '\n' ' ')"
          else
            echo "::warning title=Train motion::No trace was written"
          fi

      - name: Check the start-up station
        id: startup
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # Everyday situations from the Python reference (a made-up commuter, the
          # bundled timetable): launch at that time and place, read the station
          # the app chose, and compare.
          python3 tools/commute_reference.py --e2e Departures/Resources/network.json \
            Departures/Resources/schedule.json e2e.tsv > /dev/null
          container=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          choice="$container/Documents/startup-choice.txt"
          failed=0
          while IFS=$'\t' read -r name home work lat lon when station reason <&3; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
            rm -f "$choice"
            sleep 1
            args=(-debugNow "$when" -debugLocation "$lat,$lon,10")
            [ "$home" != "-" ] && args+=(-homeStation "$home")
            [ "$work" != "-" ] && args+=(-workStation "$work")
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "${args[@]}" > /dev/null < /dev/null
            for i in $(seq 1 30); do
              [ -s "$choice" ] && break
              sleep 0.5
            done
            got=$(tr -d '\n' < "$choice" 2> /dev/null || true)
            sleep 6
            xcrun simctl io "$UDID" screenshot --type=png "shots/start-$name.png" > /dev/null 2>&1 < /dev/null
            if [ "$got" = "$station $reason" ]; then
              echo "ok    $name ($when): $got"
            else
              echo "FAIL  $name ($when): got '$got', expected '$station $reason'"
              echo "::error title=Start-up station::$name: got '$got', expected '$station $reason'"
              failed=1
            fi
          done 3< e2e.tsv
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Publish to a screenshots branch
        if: always() && steps.sim.outputs.udid != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.sim.outputs.name }}
          RUNTIME: ${{ steps.sim.outputs.runtime }}
        run: |
          cd shots
          printf '# Simulator screenshots\n\n%s (%s), commit %s on %s (run %s).\n' \
            "${NAME//_/ }" "${RUNTIME##*.}" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          # One screenshots branch per source branch, so parallel runs don't overwrite each other.
          TARGET="screenshots-${GITHUB_REF_NAME//\//-}"
          [ -n "$IOS_VERSION" ] && TARGET="$TARGET-ios$IOS_VERSION"
          [ -n "$DEVICE" ] && TARGET="$TARGET-$(echo "$DEVICE" | tr 'A-Z ' 'a-z-')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET"
          echo "::notice title=Screenshots::Pushed $(ls *.png | wc -l | tr -d ' ') screenshots to $TARGET"

      - name: Fail if the start-up station was wrong
        if: steps.startup.outputs.failed == '1'
        run: exit 1
