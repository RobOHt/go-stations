name: Build

# Pushes to main are compiled by the TestFlight workflow, so this only runs for
# pull requests (or by hand) to save Mac runner time.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Compile (iOS Simulator)
    # GitHub's Xcode 27 image (macOS 27, Apple silicon) with the iOS 27 SDK and simulators.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          # Build with the iOS 27 SDK so the app gets iOS 27's own look (scroll edge
          # effects changed in iOS 27). 27.1 is the newest release App Store Connect
          # takes; fall back to the newest other 27.x release.
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Departures.xcodeproj \
            -scheme Departures \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Report diagnostics
        if: always()
        run: |
          # One annotation listing every Swift warning/error, readable via the checks API.
          diags=$(grep -E "\.swift:[0-9]+:[0-9]+: (warning|error):" build.log \
            | sed "s#${GITHUB_WORKSPACE}/##" | sort -u | head -80 || true)
          if [ -n "$diags" ]; then
            body=$(printf '%s' "$diags" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=Swift diagnostics::$body"
          else
            echo "::notice title=Swift diagnostics::none"
          fi

      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "## Compiler errors"
            echo '```'
            grep -E "error:" build.log | sort -u | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
