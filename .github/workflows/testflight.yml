name: TestFlight

# Builds an unsigned archive, then lets Xcode sign it for the App Store with
# Apple's cloud-managed distribution certificate (via an App Store Connect API
# key) and upload it to TestFlight. No device registration or certificates to
# manage: the CI machine never needs a development profile.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      Key ID of the App Store Connect API key (Admin role)
#   ASC_ISSUER_ID   Issuer ID shown above the keys list
#   ASC_KEY_P8      Full contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com -> Membership)
#
# Until those exist, every run skips straight to a "not configured" notice.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight::Not configured yet. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets."
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'

      - name: Select newest Xcode 26
        if: steps.config.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install API key
        if: steps.config.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Register bundle ID
        if: steps.config.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          BUNDLE_ID=$(xcodebuild -project Departures.xcodeproj -target Departures -configuration Release \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ PRODUCT_BUNDLE_IDENTIFIER = / {print $2; exit}')
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/register_bundle_id.py "$BUNDLE_ID" "GO Stations"

      - name: Archive (unsigned)
        if: steps.config.outputs.ready == 'true'
        run: |
          set -o pipefail
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10))
          xcodebuild \
            -project Departures.xcodeproj \
            -scheme Departures \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GOStations.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/GOStations.xcarchive/Products/Applications"

      - name: Attach entitlements
        if: steps.config.outputs.ready == 'true'
        run: |
          # Xcode's export reads the entitlements from the archived app's signature,
          # so give the unsigned app an ad-hoc signature that carries them.
          APP=$(ls -d "$RUNNER_TEMP/GOStations.xcarchive/Products/Applications/"*.app | head -1)
          APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"
          cat > "$RUNNER_TEMP/entitlements.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key><string>${APP_ID}</string>
            <key>com.apple.developer.team-identifier</key><string>${APPLE_TEAM_ID}</string>
            <key>com.apple.developer.ubiquity-kvstore-identifier</key><string>${APP_ID}</string>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | head -20

      - name: Upload to TestFlight
        if: steps.config.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GOStations.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Report failure details
        if: failure() && steps.config.outputs.ready == 'true'
        run: |
          diags=$( (grep -hE "error:|error :|Error Domain|is not available|No profiles|No Account|App Store Connect|application record|ITMS-|Upload failed|NSLocalizedDescription" archive.log export.log 2>/dev/null || true) | sort -u | head -40)
          body=$(printf '%s' "$diags" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=TestFlight failure::$body"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
