name: Probe live feeds

# Prints what Metrolinx's live train feeds return right now (tools/probe_live.py),
# for working on the app's live train positions and stop times. Run by hand.
# Uses the METROLINX_API_KEY repository secret, which it never prints.

on:
  workflow_dispatch:
    inputs:
      polls:
        description: How many times to poll each feed
        default: "4"
      gap:
        description: Seconds between polls
        default: "15"
      mode:
        description: "overview, timeline (trains only, the feeds side by side over time), worker (the app's /v1/live/trains, as the app sees it), or record (the feeds as the watcher keeps them, for `minutes`, scored)"
        default: overview
      minutes:
        description: "With mode record: how long to record, in minutes"
        default: "20"
      trip:
        description: "DAY/NUMBER (e.g. 20261106/3837): just that trip's Schedule/Trip stops, as Metrolinx gives them"
        default: ""
      approach:
        description: "STATION (e.g. UN): trains coming into it, as the feeds and the worker have them"
        default: ""
      near:
        description: "STATION (e.g. UN): every train near it, report by report (how steady GO's GPS is there)"
        default: ""
      cancellations:
        description: "true: how cancelled trains show in each feed; with station, its NextService lines too"
        default: ""
      station:
        description: "STATION (e.g. UN): with cancellations, that station's NextService lines"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      METROLINX_API_KEY: ${{ secrets.METROLINX_API_KEY }}
      POLLS: ${{ inputs.polls }}
      GAP: ${{ inputs.gap }}
      MODE: ${{ inputs.mode }}
      TRIP: ${{ inputs.trip }}
      APPROACH: ${{ inputs.approach }}
      NEAR: ${{ inputs.near }}
      CANCELLATIONS: ${{ inputs.cancellations }}
      STATION: ${{ inputs.station }}
      MINUTES: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@v5
      # (For tools/cancelled_cost.mjs, which reads the Worker's own code.)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe
        run: |
          if [ "$CANCELLATIONS" = true ]; then
            python3 tools/probe_live.py --cancellations ${STATION:+--station "$STATION"}
            # And what reading them costs the Worker.
            node tools/cancelled_cost.mjs
            exit 0
          fi
          if [ -n "$TRIP" ]; then
            python3 tools/probe_live.py --trip "$TRIP"
            exit 0
          fi
          if [ -n "$NEAR" ]; then
            python3 tools/probe_live.py --near "$NEAR" --polls "${POLLS:-4}" --gap "${GAP:-15}"
            exit 0
          fi
          if [ -n "$APPROACH" ]; then
            python3 tools/probe_live.py --approach "$APPROACH" --polls "${POLLS:-4}" --gap "${GAP:-15}"
            exit 0
          fi
          if [ "$MODE" = "record" ]; then
            # The feeds as the Worker's watcher keeps them, scored as it would score them.
            node tools/record_feeds.mjs --minutes "${MINUTES:-20}" --out feeds.ndjson
            gzip -9 feeds.ndjson
            node tools/replay_archive.mjs feeds.ndjson.gz
            exit 0
          fi
          if [ "$MODE" = "worker" ]; then
            python3 tools/probe_live.py --worker --polls "${POLLS:-4}" --gap "${GAP:-15}"
            exit 0
          fi
          extra=""
          if [ "$MODE" = "timeline" ]; then extra="--timeline"; fi
          python3 tools/probe_live.py --polls "${POLLS:-4}" --gap "${GAP:-15}" $extra

      - name: Keep the recording
        if: inputs.mode == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: feeds
          path: feeds.ndjson.gz
          retention-days: 1
          if-no-files-found: ignore
